name: plately
description: Plately — AI-powered high-protein meal planner for students.
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.1

  # Image picking
  image_picker: ^1.1.2

  # Local storage
  shared_preferences: ^2.3.2

  # Local DB (SQLite)
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Cached network images
  cached_network_image: ^3.3.1

  # ── UI UPGRADE PACKAGES ──────────────────────────────────────
  flutter_animate: ^4.5.0
  lucide_icons_flutter: ^3.1.13
  shimmer: ^3.0.0
  camera: ^0.11.0
  animations: ^2.0.0
  flutter_svg: ^2.0.10

  # ── FIREBASE AUTH ──────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

  # ── NOTIFICATIONS ──────────────────────────────────────────────
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Markdown rendering for AI chat responses
  flutter_markdown: ^0.7.4

  # Charts — macro dashboard bar chart
  fl_chart: ^0.68.0

  # URL launcher — Shopee deep-links
  url_launcher: ^6.3.0

  # Screenshot + share — recipe share card
  screenshot: ^3.0.0
  share_plus: ^10.0.0

  # App version display
  package_info_plus: ^8.0.0

  # Camera permission handling
  permission_handler: ^11.3.1

  # Deep links -- Android App Links for email verification / password reset
  app_links: ^6.3.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#043B3C"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 23

flutter_native_splash:
  color: "#043B3C"
  color_dark: "#043B3C"
  image: assets/icon/icon.png
  android: true
  ios: false
  fullscreen: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
