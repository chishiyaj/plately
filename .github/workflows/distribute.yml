name: Build & Distribute APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Install Flutter packages
        working-directory: frontend
        run: flutter pub get

      - name: Restore keystore
        working-directory: frontend/android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks

      - name: Write key.properties
        working-directory: frontend/android
        run: |
          cat > key.properties << EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        working-directory: frontend
        run: |
          flutter build apk --release \
            --dart-define=PLATELY_API_URL=${{ secrets.PLATELY_API_URL }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Distribute APK
        working-directory: frontend
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app ${{ secrets.FIREBASE_APP_ID }} \
            --groups "testers" \
            --release-notes "Auto build from commit ${{ github.sha }} — ${{ github.event.head_commit.message }}"
